<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fire Vs Fire</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./options.css" />
    <link rel="stylesheet" href="../content/content.css" />
  </head>
  <body>
    <!-- Floating Embers Background Engine -->
    <canvas id="ember-webgl-canvas" aria-hidden="true"></canvas>

    <main class="popup-root">
      <header class="app-header">
        <div class="logo-wrap">
          <img
            src="../icons/icon.svg"
            alt=""
            class="logo"
            id="status-logo"
          />
        </div>
        <h1 class="app-title">Fire Vs Fire</h1>
        <p class="run-state idle" id="run-state" aria-live="polite">
          <span class="dot" aria-hidden="true"></span>
          <span id="run-state-text">Idle</span>
        </p>
      </header>

      <!-- Quick Navigation & App Hub -->
      <div class="quick-nav-bar">
        <button id="open-fullpage-btn" type="button" class="nav-pill-btn" title="Open Settings in a full browser tab">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
          <span>Full Page</span>
        </button>
        <button id="open-models-btn" type="button" class="nav-pill-btn" title="Open 4-Quadrant Model Downloads">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          <span>Model Hub</span>
        </button>
        <button id="open-guide-btn" type="button" class="nav-pill-btn" title="View Guide on How to Use Fire vs Fire">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          <span>How to Use</span>
        </button>
      </div>

      <!-- Native Host & Updates Panel -->
      <section class="panel native-host-panel">
        <div class="panel-header-row">
          <div class="panel-header-title">
            <strong style="font-size: 13px;">Native Inference Host</strong>
            <span class="panel-header-sub" id="host-detail-text">Local GPU / CPU classifier bridge</span>
          </div>
          <span class="host-status-badge checking" id="host-status-badge">Checking…</span>
        </div>

        <div class="host-update-controls">
          <button id="check-host-update-btn" type="button" class="btn btn-outline" style="font-size: 12px; padding: 5px 12px;">
            <span>↻ Check for Updates</span>
          </button>
          <div id="host-update-status" class="host-update-status" style="display: none;"></div>
        </div>
      </section>

      <section class="panel detection-panel">
        <label class="toggle-row master-toggle">
          <span class="toggle-row-text">
            <strong>Enable detection</strong>
            <span class="toggle-row-hint">Classify content as you browse</span>
          </span>
          <span class="switch">
            <input type="checkbox" id="enabled" checked />
            <span class="switch-slider" aria-hidden="true"></span>
          </span>
        </label>
      </section>

      <details class="collapsible filters-panel">
        <summary class="collapsible-summary">Filters</summary>
        <div class="collapsible-body">
          <label class="toggle-row">
            <span class="toggle-row-text">Only process images with alt text</span>
            <span class="switch">
              <input type="checkbox" id="altTextOnly" />
              <span class="switch-slider" aria-hidden="true"></span>
            </span>
          </label>
          <p class="field-hint">
            Faster; likely to skip unnecessary images.
          </p>

          <label class="field">
            <span class="field-label">Minimum text length (characters)</span>
            <input
              type="number"
              class="input-number"
              id="minTextLength"
              min="50"
              max="2000"
              step="10"
              value="250"
            />
          </label>
        </div>
      </details>

      <section class="panel categories-panel" id="categories-section">
        <div class="panel-heading">
          <h2 class="panel-title">Categories</h2>
        </div>

        <button id="add-ensemble" type="button" class="btn btn-outline btn-block">
          + New category
        </button>

        <div id="category-strip-wrap" class="category-strip-wrap" hidden>
          <div id="category-strip" class="category-strip" role="tablist"></div>
        </div>

        <div id="category-panel" class="category-detail" hidden></div>
      </section>

      <details class="collapsible advanced-panel">
        <summary class="collapsible-summary">Advanced</summary>
        <div class="collapsible-body">
          <div class="btn-row">
            <button id="refresh-models" type="button" class="btn btn-outline">
              Refresh classifiers
            </button>
          </div>
          <p id="model-status" class="status" hidden></p>
          <div class="btn-row" style="margin-top: 6px;">
            <button id="open-onboarding" type="button" class="btn btn-outline btn-block">
              Model Hub &amp; Setup Guide
            </button>
          </div>

          <label class="field">
            <span class="field-label">
              Classification debounce
              <span class="field-value-inline"
                ><span id="classificationDelayValue">100</span> ms</span
              >
            </span>
            <input
              type="range"
              class="range-accent"
              id="classificationDelay"
              min="0"
              max="500"
              step="10"
              value="100"
            />
          </label>

          <label class="field">
            <span class="field-label">
              Image capture quality
              <span class="field-value-inline" id="imageCaptureQualityValue"
                >1.00</span
              >
            </span>
            <input
              type="range"
              class="range-accent"
              id="imageCaptureQuality"
              min="0.2"
              max="1"
              step="0.05"
              value="1"
            />
          </label>

          <label class="toggle-row">
            <span class="toggle-row-text">Verbose logs (batches, GPU, timing)</span>
            <span class="switch">
              <input type="checkbox" id="verboseLogs" />
              <span class="switch-slider" aria-hidden="true"></span>
            </span>
          </label>

          <label class="toggle-row">
            <span class="toggle-row-text">Instantly unload models to save memory</span>
            <span class="switch">
              <input type="checkbox" id="lazyLoad" />
              <span class="switch-slider" aria-hidden="true"></span>
            </span>
          </label>

          <div class="btn-row">
            <button id="reclassify-all" type="button" class="btn btn-outline">
              Reclassify all pages
            </button>
            <button id="cancel-all" type="button" class="btn btn-outline">
              Cancel all classifications
            </button>
          </div>
        </div>
      </details>
    </main>
    <div id="particle-layer" class="particle-layer" aria-hidden="true"></div>
    <script src="../shared/visualEffects.js"></script>
    <script src="../shared/ensembles.js"></script>
    <script src="./options.js" type="module"></script>
  </body>
</html>
