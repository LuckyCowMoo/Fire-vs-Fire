<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fire Vs Fire</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./options.css" />
    <link rel="stylesheet" href="../content/content.css" />
  </head>
  <body>
    <main class="popup-root">
      <header class="app-header">
        <div class="logo-wrap">
          <img
            src="../icons/icon.svg"
            alt=""
            class="logo"
            id="status-logo"
          />
        </div>
        <h1 class="app-title">Fire Vs Fire</h1>
        <p class="run-state idle" id="run-state" aria-live="polite">
          <span class="dot" aria-hidden="true"></span>
          <span id="run-state-text">Idle</span>
        </p>
      </header>

      <section class="panel detection-panel">
        <label class="toggle-row master-toggle">
          <span class="toggle-row-text">
            <strong>Enable detection</strong>
            <span class="toggle-row-hint">Classify content as you browse</span>
          </span>
          <span class="switch">
            <input type="checkbox" id="enabled" checked />
            <span class="switch-slider" aria-hidden="true"></span>
          </span>
        </label>
      </section>

      <details class="collapsible filters-panel">
        <summary class="collapsible-summary">Filters</summary>
        <div class="collapsible-body">
          <label class="toggle-row">
            <span class="toggle-row-text">Only process images with alt text</span>
            <span class="switch">
              <input type="checkbox" id="altTextOnly" />
              <span class="switch-slider" aria-hidden="true"></span>
            </span>
          </label>
          <p class="field-hint">
            Faster; likely to skip unnecessary images.
          </p>

          <label class="field">
            <span class="field-label">Minimum text length (characters)</span>
            <input
              type="number"
              class="input-number"
              id="minTextLength"
              min="50"
              max="2000"
              step="10"
              value="250"
            />
          </label>
        </div>
      </details>

      <section class="panel categories-panel" id="categories-section">
        <div class="panel-heading">
          <h2 class="panel-title">Categories</h2>
        </div>

        <button id="add-ensemble" type="button" class="btn btn-outline btn-block">
          + New category
        </button>

        <div id="category-strip-wrap" class="category-strip-wrap" hidden>
          <div id="category-strip" class="category-strip" role="tablist"></div>
        </div>

        <div id="category-panel" class="category-detail" hidden></div>
      </section>

      <details class="collapsible advanced-panel">
        <summary class="collapsible-summary">Advanced</summary>
        <div class="collapsible-body">
          <div class="btn-row">
            <button id="refresh-models" type="button" class="btn btn-outline">
              Refresh classifiers
            </button>
          </div>
          <p id="model-status" class="status" hidden></p>
          <div class="btn-row" style="margin-top: 6px;">
            <button id="open-onboarding" type="button" class="btn btn-outline btn-block">
              Model Hub &amp; Setup Guide
            </button>
          </div>

          <label class="field">
            <span class="field-label">
              Classification debounce
              <span class="field-value-inline"
                ><span id="classificationDelayValue">100</span> ms</span
              >
            </span>
            <input
              type="range"
              class="range-accent"
              id="classificationDelay"
              min="0"
              max="500"
              step="10"
              value="100"
            />
          </label>

          <label class="field">
            <span class="field-label">
              Image capture quality
              <span class="field-value-inline" id="imageCaptureQualityValue"
                >1.00</span
              >
            </span>
            <input
              type="range"
              class="range-accent"
              id="imageCaptureQuality"
              min="0.2"
              max="1"
              step="0.05"
              value="1"
            />
          </label>

          <label class="toggle-row">
            <span class="toggle-row-text">Verbose logs (batches, GPU, timing)</span>
            <span class="switch">
              <input type="checkbox" id="verboseLogs" />
              <span class="switch-slider" aria-hidden="true"></span>
            </span>
          </label>

          <label class="toggle-row">
            <span class="toggle-row-text">Instantly unload models to save memory</span>
            <span class="switch">
              <input type="checkbox" id="lazyLoad" />
              <span class="switch-slider" aria-hidden="true"></span>
            </span>
          </label>

          <div class="btn-row">
            <button id="reclassify-all" type="button" class="btn btn-outline">
              Reclassify all pages
            </button>
            <button id="cancel-all" type="button" class="btn btn-outline">
              Cancel all classifications
            </button>
          </div>
        </div>
      </details>
    </main>
    <div id="particle-layer" class="particle-layer" aria-hidden="true"></div>
    <script src="../shared/visualEffects.js"></script>
    <script src="../shared/ensembles.js"></script>
    <script src="./options.js" type="module"></script>
  </body>
</html>
