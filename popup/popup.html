<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Firefox Extension</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main>
      <h1>Firefox Template</h1>
      <button id="toggle">MOOOOOO popup</button>
      <button id="cancelBtn" style="margin-left: 8px; background-color: #ff6b6b; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Cancel All</button>
      <p id="status" style="display: none"></p>
      <p class="hint">Tip: set your highlight color in Options.</p>
    </main>
    <script src="./popup.js" type="module"></script>
  </body>
</html>
